[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailiq"
version = "0.1.0"
description = "Retail experimentation and AI decision intelligence platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "xgboost",
    "matplotlib",
    "seaborn",
    "sqlalchemy",
    "psycopg2-binary",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "requests",
    "streamlit",
    "plotly",
    "joblib",
    "mlflow",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
    "integration: tests requiring running RetailIQ services",
]